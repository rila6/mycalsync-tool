name: Keep alive
# GitHub disables scheduled workflows in a public repo after 60 days without repository
# activity (the workflow's own runs do not count). Runs weekly; if the last commit is
# 30+ days old it adds an empty commit, so the gap never approaches 60 days.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit if the repo has been quiet for 30+ days
        run: |
          age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "last commit is ${age} days old"
          if [ "$age" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows enabled"
            git push
          fi
